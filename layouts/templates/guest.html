<!DOCTYPE html>
{% load static %}
{% load i18n %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tax E-service</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=figtree:400,500,600&display=swap" rel="stylesheet"/>
    <style>

    </style>
    <link rel="stylesheet" type="text/css" href="{% static '/vendors/core/core.css' %}">
    <link rel="stylesheet" type="text/css"
          href="{% static '/vendors/bootstrap-datepicker/bootstrap-datepicker.min.css' %}">

    <link rel="stylesheet" type="text/css" href="{% static '/fonts/feather-font/css/iconfont.css' %}">
    <link rel="stylesheet" href="{% static '/vendors/flag-icon-css/css/flag-icon.min.css' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon.png' %}"/>

    <link rel=" stylesheet
    " href="{% static '/css/demo2/style.css' %}">

    <style>
        .authLogin-side-wrapper {
            width: 100%;
            height: 100%;
            background-image: url('{% static 'images/login.png' %}');
        }

        @font-face {
            font-family: Kalimati;
            src: url('../fonts/kalimati.ttf');
        }

        .nepali_td {
            font-family: kalimati, serif; /* Replace 'Your-English-Font' with the desired English font */
        }


        .blink {
            animation: blinker 1.5s linear infinite;
            color: blue;
            font-family: sans-serif;
        }

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }

        h1, h3 {
            color: #266150;
        }

        li {
            display: inline;
            text-decoration: none;
            padding: 5px;
        }

        a {
            text-decoration: none;
            color: #DDAF94;
        }

        a:hover {
            color: #4F4846;
        }

        .active {
            background-color: #266150;
            padding: 5px;
            text-align: right;
            border-radius: 7px;
        }
    </style>
</head>
<body>
<div class="">
    <div class="main-wrapper">
        <div class="page-wrapper full-page">
            <div class="page-content d-flex align-items-center justify-content-center">
                <div class="row w-100 mx-0 auth-page">
                    <div class="col-md-12 col-xl-6 mx-auto">
                        <div class="card">
                            <div class="row">
                                <div class="col-md-4 pe-md-0">
                                    <div class="authLogin-side-wrapper">

                                    </div>
                                </div>
                                {% block content_wrapper %}
                                {% endblock %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'vendors/core/core.js' %}"></script>
<script src="{% static '/vendors/chartjs/Chart.min.js' %}"></script>
<script src="{% static '/vendors/jquery.flot/jquery.flot.js' %}"></script>
<script src="{% static '/vendors/jquery.flot/jquery.flot.resize.js' %}"></script>
<script src="{% static '/vendors/bootstrap-datepicker/bootstrap-datepicker.min.js' %}"></script>
<script src="{% static '/vendors/apexcharts/apexcharts.min.js' %}"></script>
<script src="{% static 'vendors/feather-icons/feather.min.js' %}"></script>
<script src="{% static 'js/template.js' %}"></script>
<script src="{% static '/js/dashboard-dark.js' %}"></script>
<script src="{% static '/js/datepicker.js' %}"></script>
</body>
</html>
